/* ================= RESET ================= */
*{

body {
  margin: 0;

  background-image:

/* ================= CONTAINER ================= */

.container{
  width:100%;
  max-width:420px;
  text-align:center;
  position:relative;

  padding:32px 24px;
  border-radius:30px;

  background:
    linear-gradient(

      rgba(255,255,255,.06),
      rgba(255,255,255,.02)
    );

  backdrop-filter: blur(18px);

  border:1px solid rgba(255,255,255,.18);

  box-shadow:
    0 25px 60px rgba(0,0,0,.85);

  overflow:hidden;
}

/* glow tipis beda style */
.container::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:30px;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.35),
    transparent
  );
  opacity:.25;
  pointer-events:none;
}

/* ================= LOGO ================= */

.logo-wrapper{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}

.logo{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;

  border:2px solid rgba(255,255,255,.85);

  box-shadow:
    0 0 30px rgba(255,255,255,.25);

  transition:.4s ease;
}

.logo:hover{
  transform:rotate(3deg) scale(1.05);
}

/* ================= TITLE ================= */

.title-box{
  margin-bottom:26px;
}

.title-box h2{
  font-family:"Orbitron";
  font-size:26px;
  letter-spacing:6px;
  font-weight:600;
}

/* ================= BANNER ================= */

.banner{
  border-radius:20px;
  overflow:hidden;
  margin-bottom:26px;

  border:1px solid rgba(255,255,255,.2);
}

.banner video{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* ================= TEXT ================= */

.subtext{
  font-family:"Orbitron";
  font-size:12px;
  letter-spacing:3px;
  opacity:.75;
  margin-bottom:22px;
}

/* ================= BUTTON ================= */

.btn{
  width:100%;
  padding:15px;

  border-radius:16px;
  font-size:16px;
  letter-spacing:2px;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;

  cursor:pointer;
  transition:.35s ease;

  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06);
}

.btn:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,.12);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

/* login beda style */
.btn-login{
  backdrop-filter:blur(10px);
}

/* telegram beda feel */
.btn-tg{
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.04);
}

/* ================= FOOTER ================= */

.footer-box{
  margin-top:30px;
  padding-top:20px;

  border-top:1px solid rgba(255,255,255,.15);
}

.footer-box h3{
  font-family:"Orbitron";
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:18px;
  opacity:.8;
}

/* ================= SOCIAL ================= */

.social-row{
  display:flex;
  justify-content:center;
  gap:20px;
}

.social-btn{
  width:48px;
  height:48px;
  border-radius:50%;

  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.2);

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:20px;
  color:white;

  transition:.3s ease;
}

.social-btn:hover{
  background:white;

  transform:translateY(-3px);
}

.copyright{
  margin-top:14px;
  font-size:12px;
  opacity:.6;
}

/* ================= LOGIN ================= */

#view-login{
  display:none;
}

/* ================= LOGIN CONTAINER ================= */
.login-container{
  position:relative;
  background:rgba(15,15,18,.82);
  border-radius:26px;
  padding:38px 26px;
  max-width:420px;
  width:100%;
  text-align:center;

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter: blur(12px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.8),
    inset 0 0 25px rgba(255,255,255,.03);

  animation: loginAppear .6s ease;

  overflow:hidden;
}
.login-container::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:26px;
  padding:1px;

  background:
    linear-gradient(90deg, transparent, #fff, transparent) top,
    linear-gradient(180deg, transparent, #fff, transparent) right,
    linear-gradient(270deg, transparent, #fff, transparent) bottom,
    linear-gradient(0deg, transparent, #fff, transparent) left;

  background-size:
    200% 2px,
    2px 200%,
    200% 2px,
    2px 200%;

  background-repeat:no-repeat;

  animation:borderMove 4s linear infinite;

  pointer-events:none;
}
@keyframes borderMove{
  0%{
    background-position:
      -200% 0,
      100% -200%,
      200% 100%,
      0 200%;
  }

  100%{
    background-position:
      200% 0,
      100% 200%,
      -200% 100%,
      0 -200%;
  }
}
.profile-img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.85);

  box-shadow:
    0 0 18px rgba(255,255,255,.25),
    0 0 35px rgba(255,255,255,.08);

  margin-bottom:16px;

  animation: floatProfile 4s ease-in-out infinite;
}

@keyframes floatProfile{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}

.login-title{
  font-family:"Orbitron";
  margin-bottom:18px;
  letter-spacing:3px;
  font-size:22px;

  color:#fff;

  text-shadow:
    0 0 8px rgba(255,255,255,.25);
}
/* ================= INPUT GROUP ================= */

.input-field-group{
  position:relative;
  margin-bottom:20px;
}

/* INPUT */
.input-style{
  width:100%;
  padding:15px 45px;
  background:rgba(10,10,12,.85);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  color:#fff;
  font-size:16px;
  outline:none;
  transition:all .25s ease;
}

/* placeholder */
.input-style::placeholder{
  color:rgba(255,255,255,.45);
  letter-spacing:1px;
}

/* FOCUS EFFECT (WHITE GLOW) */
.input-style:focus{
  border-color:#ffffff;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.25),
    0 0 18px rgba(255,255,255,.15);
  background:rgba(20,20,22,.95);
}

/* garis bawah animasi */
.input-field-group::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;
  width:0%;
  height:2px;
  background:linear-gradient(90deg,
    transparent,
    #ffffff,
    transparent
  );
  transition:.35s ease;
  transform:translateX(-50%);
}

.input-field-group:focus-within::after{
  width:85%;
}

/* ================= ICON ================= */

.input-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:rgba(255,255,255,.5);
  transition:.25s;
}

/* icon aktif */
.input-field-group:focus-within .input-icon{
  color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.6);
}

/* toggle password */
.toggle-pass{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:rgba(255,255,255,.5);
  transition:.25s;
}

.toggle-pass:hover{
  color:#fff;
}
/* ================= LOGIN BUTTON ================= */

.submit-btn{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:14px;

  background:linear-gradient(
    90deg,
    #ffffff,
    #dcdcdc
  );

  color:#000;
  font-family:"Orbitron";
  font-weight:bold;
  letter-spacing:2px;

  cursor:pointer;
  transition:all .25s ease;

  box-shadow:
    0 4px 15px rgba(255,255,255,.15);
}

/* HOVER */
.submit-btn:hover{
  transform:translateY(-3px);

  box-shadow:
    0 8px 25px rgba(255,255,255,.25),
    0 0 20px rgba(255,255,255,.2);
}

/* CLICK EFFECT */
.submit-btn:active{
  transform:scale(.97);
  box-shadow:0 2px 10px rgba(255,255,255,.2);
}
/* ================= LOADING ================= */

/* ================= LOADING SCREEN ================= */

.loading-screen{
  display:none;
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle at top,#12001f,#000000 70%);

  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;

  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);

  animation: loadingFade .5s ease;
}

/* fade muncul */
@keyframes loadingFade{
  from{
    opacity:0;
    transform:scale(1.03);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}
/* ================= LOADING SCREEN ================= */

.loading-screen{
  display:none;
  position:fixed;
  inset:0;

  background:#000; /* lebih ringan dari gradient */

  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;

  animation: fadeIn .4s ease;
}

/* animasi paling ringan */
@keyframes fadeIn{
  from{ opacity:0; }
  to{ opacity:1; }
}

/* ================= VIDEO ================= */

.loading-screen video{
  width:90%;
  max-width:420px;
  height:200px;
  object-fit:cover;

  border-radius:16px;
  border:1px solid rgba(255,255,255,.15);

  box-shadow:0 8px 25px rgba(0,0,0,.7);

  /* PERFORMANCE FIX */
  transform:translateZ(0);
  will-change:auto;
  backface-visibility:hidden;
}

/* ================= TITLE ================= */

.loading-title{
  margin-top:20px;
  font-family:"Orbitron";
  font-size:24px;
  letter-spacing:4px;
  color:#fff;

  opacity:.9;
}

/* ================= TIMER ================= */

.loading-timer{
  margin-top:6px;
  font-family:"Orbitron";
  opacity:.7;
  letter-spacing:2px;
  color:#fff;
}

/* ================= BAR ================= */

.loading-bar{
  width:70%;
  max-width:300px;
  height:10px;

  background:rgba(255,255,255,.08);
  border-radius:20px;
  margin-top:20px;
  overflow:hidden;

  border:1px solid rgba(255,255,255,.12);
}

/* progress fill */
.loading-bar-fill{
  width:0%;
  height:100%;
  border-radius:20px;

  background:#ffffff;

  transition:width .25s linear;
}

/* SOFT WHITE GLOW */
body,
h1, h2, h3, h4, h5, h6,
p, a, span, label {
  color: #fff;
  text-shadow: 0 0 4px rgba(255,255,255,0.25);
}
  </style>

<body>

<!-- ================= HOME ================= -->
<section class="container" id="homePage">

  <!-- LOGO -->
  <div class="logo-wrapper">
    <img src="https://files.catbox.moe/jiny57.jpg" alt="FannyFa Logo" class="logo">
  </div>

  <!-- TITLE -->
  <div class="title-box">
    <h2>FannyFa</h2>
  </div>

  <!-- VIDEO BANNER -->
  <div class="banner">
    <video autoplay muted loop playsinline preload="auto">
      <source src="https://files.catbox.moe/47o8he.mp4" type="video/mp4">
    </video>
  </div>

  <!-- TEXT -->
  <p class="subtext">Please log in to continue.</p>

  <!-- LOGIN BUTTON -->
  <button id="showForm" class="btn btn-login">
    <i class="fas fa-user"></i>
    <span>Sign-in with Username</span>
  </button>

  <!-- TELEGRAM LOGIN -->
  <a href="https://t.me/fannyfadeveloper" class="btn btn-tg" target="_blank">
    <i class="fab fa-telegram"></i>
    <span>Sign-in with Telegram</span>
  </a>

  <!-- FOOTER -->
  <footer class="footer-box">
    <h3>CONNECT WITH US</h3>

    <div class="social-row">
      <a href="#" class="social-btn"><i class="fas fa-user"></i></a>
      <a href="#" class="social-btn"><i class="fab fa-tiktok"></i></a>
    </div>

    <div class="copyright">
      © 2026 FannyFa Developer
    </div>
  </footer>

</section>

<!-- =============== LOGIN PAGE =============== -->
<div id="view-login">
  <div class="login-container">

      <img src="https://files.catbox.moe/jiny57.jpg" class="profile-img">

      <h2 class="login-title">FannyFa</h2>

      <form action="/auth" method="POST" id="serverForm" style="display:none;">
          <input type="text" name="username" id="realUser">
          <input type="text" name="key" id="realPass">
      </form>

      <div class="input-field-group">
        <i class="fas fa-user input-icon"></i>
        <input type="text" id="visUser" class="input-style" placeholder="Username">
      </div>

      <div class="input-field-group">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="visPass" class="input-style" placeholder="Password">
        <i id="toggleBtn" class="fas fa-eye-slash toggle-pass"></i>
      </div>

      <button class="submit-btn" id="btnLoginSubmit">LOGIN</button>

  </div>
</div>

<!-- ============= LOADING SCREEN ============= -->
<div id="loadingScreen" class="loading-screen">

    <video autoplay muted loop playsinline id="loadingVideo">
        <source src="https://files.catbox.moe/xkgk0a.mp4" type="video/mp4">
    </video>

    
    <div class="loading-timer" id="loadingTimer">Loading… 18s</div>

    <div class="loading-bar">
        <div class="loading-bar-fill" id="loadingFill"></div>
    </div>
<div class="loading-title">FannyFa</div>
</div>

<script>
  const showForm = document.getElementById("showForm");
  const homePage = document.getElementById("homePage");
  const viewLogin = document.getElementById("view-login");

  const visUser = document.getElementById("visUser");
  const visPass = document.getElementById("visPass");
  const realUser = document.getElementById("realUser");
  const realPass = document.getElementById("realPass");
  const serverForm = document.getElementById("serverForm");
  const toggleBtn = document.getElementById("toggleBtn");

  const btnLoginSubmit = document.getElementById("btnLoginSubmit");
  const loadingScreen = document.getElementById("loadingScreen");

  const fillBar = document.getElementById("loadingFill");
  const timerText = document.getElementById("loadingTimer");

  const LOADING_TIME = 5;  // durasi loading (detik)

  /* SHOW FORM */
  showForm.addEventListener("click", () => {
      homePage.style.display = "none";
      viewLogin.style.display = "block";
  });

  /* TOGGLE PASSWORD */
  toggleBtn.addEventListener("click", () => {
      visPass.type = visPass.type === "password" ? "text" : "password";
      toggleBtn.classList.toggle("fa-eye");
      toggleBtn.classList.toggle("fa-eye-slash");
  });

  /* PROGRESS + TIMER REALTIME */
  function startLoading(){
      let timeLeft = LOADING_TIME;
      let progress = 0;
      const interval = 100; // 0.1 detik
      const totalSteps = LOADING_TIME * 1000 / interval;

      const timer = setInterval(() => {

          progress += 1;
          fillBar.style.width = (progress / totalSteps * 100) + "%";

          timerText.innerText = "Loading… " + timeLeft + "s";

          if(progress % (1000 / interval) === 0){
              timeLeft--;
          }

          if(progress >= totalSteps){
              clearInterval(timer);
              serverForm.submit();
          }

      }, interval);
  }

  /* AKTIFKAN SUARA setelah klik LOGIN */
  function enableSound(){
      const v = document.getElementById("loadingVideo");
      v.muted = false;
      v.volume = 1.0;
      v.play().catch(()=>{});
  }

  /* LOGIN SYSTEM */
  btnLoginSubmit.addEventListener("click", () => {

      let user = visUser.value.trim();
      let pass = visPass.value.trim();

      if (user === "" || pass === "") {
          alert("Username / Password masih kosong!");
          return;
      }

      realUser.value = user;
      realPass.value = pass;

      viewLogin.style.display = "none";
      loadingScreen.style.display = "flex";

      enableSound();
      startLoading();

  });
</script>
